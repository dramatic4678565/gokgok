name: Sync Upstream

# Pulls new commits from excalidraw/excalidraw into this repo automatically.
# Runs on a schedule, so it works with your PC switched off. You can also
# trigger it by hand from the Actions tab.
#
# When the merge is clean, the pull request is auto-merged and main updates
# itself. When it conflicts, it stops and opens a PR + issue for you to
# resolve -- it will never force anything through.

on:
  schedule:
    # every 6 hours; GitHub can delay these, that is normal
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sync even if upstream has no new commits"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# Two syncs must never race each other.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      result: ${{ steps.run.outputs.result }}
      pr: ${{ steps.run.outputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: merging an unrelated upstream needs the whole graph.
          fetch-depth: 0

      - name: Sync
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/sync-upstream.sh ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          pr=$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number // empty')
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Upstream sync: ${{ steps.run.outputs.result || 'skipped' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream commit | \`$(git rev-parse upstream/master 2>/dev/null || echo 'not fetched')\` |"
            echo "| Pull request | ${{ steps.run.outputs.pr_number ? format('#{0}', steps.run.outputs.pr_number) : 'none' }} |"
            echo ""
            if [ "${{ steps.run.outputs.result }}" = "conflict" ]; then
              echo "**Merge conflicts.** Run \`./scripts/sync-upstream.ps1 -Resolve\` locally."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
